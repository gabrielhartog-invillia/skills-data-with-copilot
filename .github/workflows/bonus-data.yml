name: Bônus — ETL de vinhos

on:
  push:
    paths:
      - "lab/**"
      - ".github/workflows/bonus-data.yml"
  pull_request:
    paths:
      - "lab/**"
      - ".github/workflows/bonus-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  etl:
    name: Validar e gerar resumo
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r lab/requirements.txt

      - name: Validar módulos
        run: python lab/check.py --module all

      - name: Executar ETL
        run: python -m lab.bonus_module.pipeline

      - name: Publicar resumo
        run: cat lab/outputs/bonus/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Disponibilizar CSV
        uses: actions/upload-artifact@v7
        with:
          name: bonus-wine-summary
          path: lab/outputs/bonus/summary.csv
          if-no-files-found: error
          retention-days: 7
